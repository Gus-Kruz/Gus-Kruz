"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#00FFC6)\
[  ](bg:#00FFC6 fg:#0A0F14)\
[](bg:#00BFA6 fg:#00FFC6)\
$directory\
[](fg:#00BFA6 bg:#003B3B)\
$git_branch\
$git_status\
[](fg:#003B3B bg:#002626)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#002626 bg:#001A1A)\
$time\
[ ](fg:#001A1A)\
\n$character"""

[directory]
style = "fg:#0A0F14 bg:#00BFA6"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#003B3B"
format = '[[ $symbol $branch ](fg:#00FFC6 bg:#003B3B)]($style)'

[git_status]
style = "bg:#003B3B"
format = '[[($all_status$ahead_behind )](fg:#00FFC6 bg:#003B3B)]($style)'
modified = "✏️"
untracked = "?"
staged = "✔"
deleted = "🗑"

[nodejs]
symbol = ""
style = "bg:#002626"
format = '[[ $symbol ($version) ](fg:#00FFC6 bg:#002626)]($style)'

[rust]
symbol = ""
style = "bg:#002626"
format = '[[ $symbol ($version) ](fg:#00FFC6 bg:#002626)]($style)'

[golang]
symbol = ""
style = "bg:#002626"
format = '[[ $symbol ($version) ](fg:#00FFC6 bg:#002626)]($style)'

[php]
symbol = ""
style = "bg:#002626"
format = '[[ $symbol ($version) ](fg:#00FFC6 bg:#002626)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#001A1A"
format = '[[  $time ](fg:#00FFC6 bg:#001A1A)]($style)'

[character]
success_symbol = "[❯](bold #00FFC6)"
error_symbol = "[❯](bold red)"
